name: build-nro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in devkitPro container
        run: |
          docker run --rm -v "$PWD:/src" -w /src devkitpro/devkita64:latest bash -lc '
            set -e
            export PKG_CONFIG_PATH=${DEVKITPRO}/portlibs/switch/lib/pkgconfig
            dkp-pacman -S --needed --noconfirm devkitA64 libnx switch-dev switch-glfw switch-curl switch-libmpv switch-mesa switch-cmake
            if [ ! -f libs/borealis/library/CMakeLists.txt ]; then
              git clone --depth 1 https://github.com/XITRIX/borealis.git libs/borealis
            fi
            cmake -B build -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release
            cmake --build build --target tvbox-nx.nro -j$(nproc)
            echo "=== romfs content check ==="
            test -f build/resources/xml/views/header.xml -o -d build/resources/xml/views || { echo "!! borealis xml resources MISSING"; exit 1; }
            du -sh build/resources
            find build/resources -maxdepth 2 -type d | sort | head -30
            ls -la build/*.nro build/*.elf
          '

      - name: Upload nro artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-nx-nro
          path: build/*.nro
          if-no-files-found: warn

      - name: Upload elf for crash symbolization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-nx-elf
          path: build/*.elf
          if-no-files-found: warn
