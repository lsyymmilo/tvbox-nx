# 在 GitHub 上直接编出 .nro（不需要本机装工具链）
#
# 用官方 devkitpro/devkita64 容器。海外 runner 访问 pkg.devkitpro.org 正常，
# 不存在国内那套 Cloudflare 403 的问题。
#
# 注意：这里刻意没有用作业级 container: 写法，而是 docker run。
# 原因：作业级容器里跑 actions/checkout 这类 JS action 需要容器内有 node，
# devkitA64 镜像没有 node，会直接报 node: not found。

name: build-nro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in devkitPro container
        run: |
          docker run --rm -v "$PWD:/src" -w /src devkitpro/devkita64:latest bash -lc '
            set -e
            dkp-pacman -S --needed --noconfirm switch-glfw switch-curl switch-libmpv switch-cmake
            if [ ! -f libs/borealis/CMakeLists.txt ]; then
              git clone --depth 1 https://github.com/XITRIX/borealis.git libs/borealis
            fi
            cmake -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j$(nproc)
          '

      - name: Upload nro artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-nx-nro
          path: build/**/*.nro
          if-no-files-found: warn
